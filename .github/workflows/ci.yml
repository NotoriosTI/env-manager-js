# CI de env-manager-js.
#
# Blueprint §1.6.1: el repo es público, así que los minutos no se facturan —
# pero igual se pone techo a todo (§1.5.3) y se cancelan los runs que quedaron
# atrás (§1.5.2: no se paga por esperar algo que ya no importa).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un PR que recibe tres pushes seguidos deja corriendo un solo run, el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: vitest (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Los tests de la CLI ejercitan dist/, así que el build va antes.
        run: npm run build

      - name: Test
        run: npm test

  parity:
    name: Gate de paridad py <-> js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Solo en push a main, no en PRs. El job hace checkout del repo hermano en
    # su rama main, y el gate compara `main` contra `main`: en un PR el hermano
    # todavía no tiene los cambios de este lado, así que el resultado no diría
    # nada útil. El gate obligatorio antes de abrir un PR es el script local
    # `scripts/parity-check.sh`, como exige PARITY.md.
    if: github.event_name == 'push'
    steps:
      - name: Checkout env-manager-js
        uses: actions/checkout@v4
        with:
          path: env-manager-js

      - name: Checkout env-manager
        uses: actions/checkout@v4
        with:
          repository: NotoriosTI/env-manager
          path: env-manager

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: env-manager-js/package-lock.json

      - name: Install dependencies
        run: |
          cd env-manager && uv sync --extra encrypted
          cd ../env-manager-js && npm ci

      - name: Run the parity gate
        env:
          ENV_MANAGER_PY: ${{ github.workspace }}/env-manager
          PYTHON_BIN: ${{ github.workspace }}/env-manager/.venv/bin/python
        run: env-manager-js/scripts/parity-check.sh
